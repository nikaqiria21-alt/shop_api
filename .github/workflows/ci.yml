name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop_test_db
          POSTGRES_USER: shop_test_user
          POSTGRES_PASSWORD: shop_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks and unit tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DB_NAME: shop_test_db
          DB_USER: shop_test_user
          DB_PASSWORD: shop_test_password
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test store -v 2